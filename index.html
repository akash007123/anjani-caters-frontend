    <!-- Cookie Consent Script -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        if (!localStorage.getItem('cookieConsent')) {
          var consentBanner = document.createElement('div');
          consentBanner.innerHTML = '<div style="position:fixed;bottom:0;left:0;right:0;background:#fff;padding:20px;box-shadow:0 -4px 20px rgba(0,0,0,0.1);z-index:9999;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px;font-family:system-ui;"><span style="flex:1;min-width:250px;">We use cookies to enhance your experience. By continuing to visit this site you agree to our use of cookies.</span><button onclick="acceptCookies()" style="background:#6B2D3D;color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;">Accept</button></div>';
          document.body.appendChild(consentBanner);
        }
      });
      function acceptCookies() {
        localStorage.setItem('cookieConsent', 'true');
        document.body.querySelector('div[style*="position:fixed;bottom:0"]').remove();
      }
    </script>
